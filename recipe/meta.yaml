{% set name = "xlwings" %}
{% set version = "0.37.8" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: ff23f1e62bdeb8256b56e11d54fca7c1efacfc227acb92d41b7d06d7f65a7e94

build:
  number: 0
  script_env:
    - BUILD_RUST=1
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation
  entry_points:
    - xlwings = xlwings.cli:main
  # From the description: Works on Windows, macOS, and Excel on the web (incl. the free version of Excel)
  # pywin32 has no py3.15 build on pkgs/main yet, so the win py3.15 variant cannot be installed
  skip: true  # [py<311 or linux or (win and py>314)]

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler("c") }}
    - {{ compiler("rust") }}
  host:
    - python
    - pip
    - maturin >=1,<2
    # https://github.com/xlwings/xlwings/blob/0.37.8/setup.py#L62-L63
    - setuptools-rust
  run:
    - python
    - pywin32 >=224  # [win]
    - psutil >=2.0.0  # [osx]
    - appscript >=1.0.1  # [osx]

test:
  imports:
    - xlwings
    - xlwings.conversion
    - xlwings.ext
    # Flask (needed by xlwings.rest) has no py3.15 build on pkgs/main yet
    - xlwings.rest  # [py<=314]
  requires:
    - pip
    - werkzeug  # [py<=314]
    - flask  # [py<=314]
  commands:
    - pip check
    - xlwings -h
    # Upstream tests drive a live Excel instance (Windows/macOS) and need admin rights; not runnable headless in CI

about:
  home: https://www.xlwings.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Interact with Excel from Python and vice versa
  description: |
    xlwings is a BSD-licensed Python library that makes it easy to call Python from Excel and vice versa.
    Note: To use xlwings PRO functionality, you need to use a license key. See https://docs.xlwings.org/en/latest/pro/license_key.html
  doc_url: https://docs.xlwings.org
  dev_url: https://github.com/xlwings/xlwings

extra:
  recipe-maintainers:
    - fzumstein
